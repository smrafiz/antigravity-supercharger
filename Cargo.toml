[package]
name = "antigravity-supercharger"
version = "0.1.0"
edition = "2021"
authors = ["Starter Developer (smrafiz)"]
description = "Fast, memory-safe guardrails and security hooks for Google Antigravity CLI written in Rust."
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
