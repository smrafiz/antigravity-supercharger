name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binary
        run: cargo build --release
      - name: Package Binary
        run: |
          mkdir -p dist
          cp target/release/antigravity-supercharger dist/supercharger-linux-x86_64
          chmod +x dist/supercharger-linux-x86_64
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supercharger-linux-x86_64
          path: dist/supercharger-linux-x86_64

  create-release:
    name: Create GitHub Release
    needs: [release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: supercharger-linux-x86_64
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            dist/supercharger-linux-x86_64 \
            --title "Antigravity Supercharger ${{ github.ref_name }}" \
            --generate-notes
