name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binary
        run: cargo build --release
      - name: Package Binary
        run: |
          mkdir -p dist
          cp target/release/antigravity-supercharger dist/supercharger-linux-x86_64
          chmod +x dist/supercharger-linux-x86_64
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supercharger-linux-x86_64
          path: dist/supercharger-linux-x86_64

  release-macos:
    name: Build macOS Universal (arm64 & x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build Release Binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Package Binaries
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/antigravity-supercharger dist/supercharger-darwin-arm64
          cp target/x86_64-apple-darwin/release/antigravity-supercharger dist/supercharger-darwin-x86_64
          chmod +x dist/supercharger-darwin-*
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supercharger-macos
          path: dist/supercharger-darwin-*

  create-release:
    name: Create GitHub Release
    needs: [release-linux, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          find dist-artifacts/ -type f -name "supercharger-*" -exec cp {} dist/ \;
          ls -la dist/
          gh release upload ${{ github.ref_name }} dist/supercharger-* --clobber || \
          gh release create ${{ github.ref_name }} \
            dist/supercharger-* \
            --title "Antigravity Supercharger ${{ github.ref_name }}" \
            --generate-notes
