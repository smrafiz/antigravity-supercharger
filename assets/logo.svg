<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2.5"/>
  
  <!-- Shield Outline with Neon Glow -->
  <path d="M 64 22 L 96 36 V 66 C 96 85 82 101 64 108 C 46 101 32 85 32 66 V 36 Z" 
        fill="none" 
        stroke="url(#boltGradient)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85"
        filter="url(#glow)"/>

  <!-- Electric Lightning Supercharger Core -->
  <path d="M 68 34 L 46 66 H 64 L 60 94 L 82 62 H 64 Z" 
        fill="url(#boltGradient)" 
        filter="url(#glow)"/>
</svg>
